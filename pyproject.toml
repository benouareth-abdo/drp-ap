[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "drp-ap"
version = "0.1.0"
description = "Directional-rank deficiency in k-means initialization: DRP-AP, DRP-AP-SA and an equal-budget benchmark"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "[Author name]"}]
keywords = ["k-means", "initialization", "clustering", "PCA", "Mahalanobis"]
dependencies = [
  "numpy>=1.24", "scipy>=1.11", "pandas>=2.0",
  "scikit-learn>=1.3", "matplotlib>=3.7", "pillow>=10.0",
]

[project.optional-dependencies]
dip = ["diptest>=0.8"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["drp_ap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
